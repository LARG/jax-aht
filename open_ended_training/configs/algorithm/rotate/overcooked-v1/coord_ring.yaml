defaults:
  - rotate/_base_
  - _self_ # values from this file override the values from the base file

TIMESTEPS_PER_ITER_PARTNER: 1.6e7 # per iter of open-ended training, divided between conf-br and conf-ego and between all partner seeds
TIMESTEPS_PER_ITER_EGO: 6e6
NUM_OPEN_ENDED_ITERS: 20
LAMBDA_1: 2 # weight on the BR return from XP term in the perstep regret loss
LAMBDA_2: 1 # weight on the BR return from SP term in the perstep regret loss
LR: 5e-05
NUM_MINIBATCHES: 8
CLIP_EPS: 0.2
ENT_COEF: 0.1
ANNEAL_LR: false
EGO_ARGS:
  LR: 3e-5
  ANNEAL_LR: false
  ENT_COEF: .001
  CLIP_EPS: 0.1
  UPDATE_EPOCHS: 10
  S5_D_MODEL: 128
  S5_SSM_SIZE: 128
  S5_ACTOR_CRITIC_HIDDEN_DIM: 1024
  FC_N_LAYERS: 3
