# Set best response set to heldout set
best_response_set:
  lbf/lbf_7x7_nolevels:
    ippo-mlp-br: # Use same policies for IPPO
      path: "val_teammates/lbf/ippo/2026-03-01_22-16-22/saved_train_run"
      actor_type: mlp
      ckpt_key: checkpoints # final_params
      idx_list: [[0, 1], [2, -1]]
      test_mode: true
    brdiv-br: # Use BR policies generated by BRDiv
      path: "val_teammates/lbf/brdiv/2026-03-01_22-51-07/saved_train_run"
      actor_type: actor_with_conditional_critic
      idx_list: [[0, 0], [0, 1], [0, 2]] # Select all agents in population for seed 0.
      ckpt_key: final_params_br # key to load from checkpoint.
      POP_SIZE: 3 # for brdiv, we need to specify population size that the method was trained with
      test_mode: false
