# @package _global_
# THIS SCRIPT CONTAINS THE PATHS FOR THE HELDOUT EVALUATION. MODIFY WITH CAUTION.
global_heldout_settings:
  EVAL_SEED: 34957
  MAX_EPISODE_STEPS: ${task.ROLLOUT_LENGTH}
  NUM_EVAL_EPISODES: 64
  AGGREGATE_STAT: mean # choices: mean, iqm. both are computed with the bootstrapped CI using rliable.
  NORMALIZE_RETURNS: true # if true, use performance bounds to normalize returns

# Upper performance bounds are the best known return with each teammate: the max over its row of
# the heldout cross-play matrix (evaluation/xp_matrices/), the best return reached by any
# benchmark agent, and the bound used in release 1.1.0.
heldout_set:
  lbf/lbf_7x7_nolevels: # In LBF, results are much better with test mode = false.
    ippo_mlp: 
      path: "eval_teammates/lbf_7x7/ippo/2025-04-21_23-41-17/saved_train_run"
      actor_type: mlp
      ckpt_key: final_params
      idx_list: [0] # load in seed 0 only
      test_mode: false
      performance_bounds:
        percent_eaten: [[0.0, 100.0]]
        returned_episode_returns: [[0.0, 0.5]]
    ippo_mlp_s2c0:
      path: "eval_teammates/lbf_7x7/ippo/2025-04-21_23-41-17/saved_train_run"
