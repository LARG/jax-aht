name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  MPLCONFIGDIR: /tmp/matplotlib
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  WANDB_MODE: disabled
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  package:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          wheel_python="$RUNNER_TEMP/wheel-venv/bin/python"
          "$wheel_python" -m pip install dist/*.whl
          "$wheel_python" -m pip check
          cd "$RUNNER_TEMP"
          "$wheel_python" -c "import agents, common, ego_agent_training, envs, evaluation, marl, open_ended_training, teammate_generation"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/verify_install.py"

  tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check changed Python files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          changed_files="$RUNNER_TEMP/changed-python-files"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py' > "$changed_files"
          if [[ ! -s "$changed_files" ]]; then
            echo "No changed Python files to check."
            exit 0
          fi
          xargs -0 ruff check < "$changed_files"
          xargs -0 ruff format --check < "$changed_files"
      - name: Run tests
        run: python -m pytest -q

  algorithms:
    name: CPU algorithm smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run one update for each algorithm
        run: bash scripts/test_algos.sh --device cpu
